name: hidamari-so CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Compose shared-react-ui
        run: make compose-ui

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: |
          npm run test:coverage
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80%"
            exit 1
          fi

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      # アカウント ID は秘密ではない
      CLOUDFLARE_ACCOUNT_ID: 8c8a65303124de06011e3cdd16926f12

    steps:
      - name: Check Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN が未登録のため、Cloudflare Pages へのデプロイをスキップしました"
          fi

      - uses: actions/checkout@v6
        if: steps.token.outputs.configured == 'true'

      - name: Use Node.js
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Compose shared-react-ui
        if: steps.token.outputs.configured == 'true'
        run: make compose-ui

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.configured == 'true'
        run: npm run build

      - name: Check this commit is still the head of main
        id: fresh
        if: steps.token.outputs.configured == 'true'
        run: |
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::origin/main の先頭を取得できませんでした"
            exit 1
          fi
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main がより新しいコミット($HEAD_SHA)に進んでいるため、古い $GITHUB_SHA のデプロイをスキップしました"
          fi

      - name: Create Pages project if missing
        if: steps.token.outputs.configured == 'true' && steps.fresh.outputs.latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LIST=$(npx wrangler pages project list)
          if printf '%s\n' "$LIST" | grep -q 'hidamari-so'; then
            echo "Pages project hidamari-so already exists"
          else
            npx wrangler pages project create hidamari-so --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.configured == 'true' && steps.fresh.outputs.latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name=hidamari-so --branch=main
